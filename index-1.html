<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lagos Life Sim — Gift Claim Demo</title>
<style>
:root{--site-primary:#31c77d;--site-secondary:#e8f4fb;--site-background:#eaf6fc;--site-on-primary:#ffffff;--site-on-secondary:#172033;--site-on-background:#172033;--site-font-body:Arial,Helvetica,sans-serif;--site-font-heading:Arial,Helvetica,sans-serif;--site-heading-scale:1;--site-spacing-scale:1;--site-radius-scale:1;--site-decoration-opacity:1}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eaf6fc;color:#111827}.app{min-height:100vh;background:#eaf6fc;padding:84px 18px 30px;display:flex;align-items:center;flex-direction:column}.brand{text-align:center;width:100%;max-width:620px}.crown{font-size:58px;line-height:1.1}.brand h1{font-size:clamp(36px,8vw,58px);letter-spacing:-2px;margin:16px 0 14px;font-weight:800;white-space:nowrap}.age{display:inline-block;vertical-align:middle;background:#111827;color:#fff;border-radius:26px;padding:8px 14px;font-size:18px;letter-spacing:0}.tagline{font-size:clamp(18px,4.3vw,29px);color:#7a8390;margin:0 0 8px;white-space:nowrap}.panel{width:100%;max-width:620px;background:#fff;border-radius:42px;padding:58px clamp(24px,10vw,62px) 40px;box-shadow:0 5px 18px #20364b0b}.notice{border:2px solid #b6f1d8;background:#edfcf6;border-radius:32px;padding:22px 18px;text-align:center;color:#126b4d;font-size:clamp(17px,3.8vw,24px);font-weight:700;line-height:1.4;margin-bottom:48px}.tabs{background:#f1f2f5;border-radius:60px;display:flex;padding:7px;margin-bottom:54px}.tab{flex:1;border:0;border-radius:52px;background:transparent;color:#707784;font-size:clamp(16px,3.8vw,25px);font-weight:700;padding:20px 5px}.tab.active{background:#fff;color:#171d2b;box-shadow:0 2px 8px #0000000b}label{display:block;color:#6f7784;font-size:clamp(15px,3.5vw,23px);font-weight:800;letter-spacing:.4px;margin:28px 0 18px}.field{width:100%;height:104px;border:2px solid #e7e8eb;border-radius:27px;background:#f9fafc;padding:0 28px;font-size:clamp(18px,4vw,27px);color:#182033;outline:none}.field:focus{border-color:#31c77d}.password-demo{height:104px;border:2px solid #e7e8eb;border-radius:27px;background:#f9fafc;display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:#a1a7b0;font-size:25px}.eye{font-size:26px;color:#9aa1ab}.helper{color:#747d89;font-size:14px;line-height:1.5;margin:14px 2px 24px}.back{display:inline-block;margin:4px 0 48px;color:#6f7784;text-decoration:none;font-size:clamp(17px,3.8vw,26px)}.submit{width:100%;border:0;border-radius:28px;background:#31c77d;color:#fff;padding:29px 12px;font-size:clamp(20px,4vw,29px);font-weight:800;box-shadow:0 5px 0 #1eaa67;cursor:pointer}.submit:active{transform:translateY(2px);box-shadow:0 3px 0 #1eaa67}.fineprint{text-align:center;color:#89919b;font-size:12px;line-height:1.5;margin:24px 0 0}.status{display:none;margin-top:18px;padding:14px;border-radius:14px;background:#edfcf6;color:#126b4d;font-size:14px;line-height:1.5}.status.show{display:block}@media(max-width:390px){.app{padding-top:54px}.panel{padding-top:38px}.notice{margin-bottom:34px}.tabs{margin-bottom:38px}.brand h1{letter-spacing:-1.5px}.tagline{white-space:normal}}
</style></head>
<body><main class="app" id="top">
<header class="brand"><div class="crown">👑</div><h1>Lagos Life Sim <span class="age">18+</span></h1><p class="tagline">Live your Lagos story with real people.</p></header>
<section class="panel" aria-label="Lagos Life Sim gift claim demo">
<div class="notice">🎁 Log in to verify your account and unlock the reward pool.</div>
<div class="tabs" aria-label="Form mode"><button class="tab active" id="createTab" type="button">Create account</button><button class="tab" id="loginTab" type="button">Log in</button></div>
<form id="claimForm">
<label for="username">USERNAME OR EMAIL</label><input class="field" id="username" name="username" autocomplete="off" placeholder="tolu_eko" required maxlength="80">
<label>PASSWORD</label><div class="password-demo" aria-label="Password field visual demo; does not accept or transmit a password"><span>••••••••</span><span class="eye" aria-hidden="true">◎</span></div>
<a class="back" href="#top" id="backLink">← Back home</a>
<button class="submit" type="submit" id="submitBtn">Log in &amp; Claim</button>
<div class="status" id="status" role="status"></div>
</form>

</section></main>
<script>
const createTab=document.getElementById('createTab'),loginTab=document.getElementById('loginTab'),submitBtn=document.getElementById('submitBtn'),statusBox=document.getElementById('status'),form=document.getElementById('claimForm');
function setMode(mode){const create=mode==='create';createTab.classList.toggle('active',create);loginTab.classList.toggle('active',!create);submitBtn.textContent=create?'Create account & Claim':'Log in & Claim';statusBox.classList.remove('show');}
createTab.addEventListener('click',()=>setMode('create'));loginTab.addEventListener('click',()=>setMode('login'));
document.getElementById('backLink').addEventListener('click',e=>{e.preventDefault();document.getElementById('username').focus()});
form.addEventListener('submit',e=>{e.preventDefault();statusBox.textContent='Demo only: no information was sent or saved. To manage real gift requests, connect a secure backend that stores usernames only.';statusBox.classList.add('show')});
</script></body></html>
